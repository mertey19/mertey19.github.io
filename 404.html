<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#e8500a">
<title>Sayfa bulunamadı (404) — Mert Erdoğan Yıldırım</title>
<meta name="description" content="Aradığınız sayfa bulunamadı. Mert Erdoğan Yıldırım portföyünün ana sayfasına dönebilirsiniz.">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf9f6;--bg2:#f3f0e9;--ink:#16130e;--ink2:#4c463c;--mut:#6c6455;
  --acc:#e8500a;--rule:#e0dacd;--rule2:#cfc7b6;
  --serif:"Fraunces",Georgia,serif;--sans:"Inter",system-ui,-apple-system,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 24px;
}
::selection{background:var(--acc);color:#fff}
a:focus-visible{outline:3px solid var(--acc);outline-offset:3px;border-radius:2px}
.box{max-width:640px;width:100%}
.num{
  font-family:var(--serif);font-weight:900;font-size:clamp(5rem,18vw,9rem);
  line-height:.9;letter-spacing:-.04em;color:var(--ink);
}
.num em{font-style:normal;color:var(--acc)}
h1{
  font-family:var(--serif);font-weight:400;font-size:clamp(1.5rem,4.5vw,2.1rem);
  letter-spacing:-.02em;margin:22px 0 14px;
}
p{color:var(--ink2);max-width:52ch}
.rule{height:1px;background:var(--rule);margin:30px 0}
.links{display:flex;flex-wrap:wrap;gap:12px}
.btn{
  display:inline-flex;align-items:center;gap:9px;text-decoration:none;
  font-size:.86rem;font-weight:600;letter-spacing:.02em;
  padding:13px 22px;border-radius:99px;transition:background .2s,color .2s,border-color .2s;
}
.btn-solid{background:var(--ink);color:var(--bg)}
.btn-solid:hover{background:var(--acc);color:#fff}
.btn-line{border:1px solid var(--rule2);color:var(--ink)}
.btn-line:hover{border-color:var(--acc);color:var(--acc)}
.foot{margin-top:34px;font-size:.8rem;color:var(--mut)}
</style>
</head>
<body>
<main class="box">
  <p style="font-size:.78rem;font-weight:700;letter-spacing:.16em;color:var(--acc)">HATA 404</p>
  <div class="num">4<em>0</em>4</div>
  <h1>Bu sayfa mevcut değil.</h1>
  <p>Aradığınız adres taşınmış, silinmiş ya da hiç var olmamış olabilir. Aşağıdaki bağlantılardan devam edebilirsiniz.</p>
  <div class="rule"></div>
  <div class="links">
    <a class="btn btn-solid" href="/">Ana sayfa</a>
    <a class="btn btn-line" href="/#projeler">Projeler</a>
    <a class="btn btn-line" href="/#iletisim">İletişim</a>
    <a class="btn btn-line" href="/en/">English</a>
  </div>
  <p class="foot"><b>Mert Erdoğan Yıldırım</b> — Ankara, Türkiye</p>
</main>
</body>
</html>
